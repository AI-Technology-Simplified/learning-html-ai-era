<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lesson 6: forms and user input">
    <title>Forms</title>
</head>
<body>
    <h1>Forms</h1>
    <h2>Contact us</h2>
    <!-- method="get": press Send, then look at the address bar to see the name=value pairs -->
    <form action="" method="get">
        <p>
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" required>
            <!-- for on the label matches id on the input. name is sent with the value. -->
        </p>
        <p>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
            <!-- required: must be filled in. placeholder: a hint, not a label. -->
        </p>
        <p>
            <label for="visit">Preferred date</label>
            <input type="date" id="visit" name="visit">
        </p>
        <fieldset>
            <legend>Preferred contact</legend>
            <label><input type="radio" name="contact" value="email" checked> Email</label>
            <label><input type="radio" name="contact" value="phone"> Phone</label>
        </fieldset>
        <!-- Radio buttons with the same name: only one can be chosen. fieldset and legend group them. -->
        <p>
            <label for="topic">Topic</label>
            <select id="topic" name="topic">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
            </select>
            <!-- select: a drop-down list. The value of the chosen option is sent. -->
        </p>
        <p>
            <label for="message">Message</label><br>
            <textarea id="message" name="message" rows="4" cols="40"></textarea>
        </p>
        <p>
            <label><input type="checkbox" name="newsletter" value="yes"> Send me the newsletter</label>
        </p>
        <button type="submit">Send</button>
        <!-- A real button: works with the keyboard and screen readers, and submits the form. -->
    </form>

    <!-- Your turn: an AI tool wrote the form below. It has 5 problems. Find and fix them. -->
    <h2>Join our newsletter</h2>
    <form action="" method="get">
        <label for="your-name">Your name</label>
        <input type="text" id="your-name" name="your-name">
        <!-- Fix 1: a real label (a placeholder is not a label), and a name so the value is sent -->
        <label for="news-email">Email</label>
        <input type="email" id="news-email" name="news-email">
        <!-- Fix 2: for matches id. Fix 3: type="email", so the browser checks it and phones show an @ key -->
        <label><input type="checkbox" name="news" value="yes"> Send me news</label>
        <!-- Fix 4: the checkbox needs a name, or its value is never sent -->
        <button type="submit">Send</button>
        <!-- Fix 5: a real button instead of a div -->
    </form>
</body>
</html>
