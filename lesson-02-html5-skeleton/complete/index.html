<!DOCTYPE html>
<!-- Tells the browser this is an HTML5 document -->
<html lang="en-GB">
<!-- Root element: wraps the whole page; lang sets British English -->
<head>
    <!-- Information about the page, not shown on screen -->
    <meta charset="UTF-8">
    <!-- Character encoding: displays all languages and symbols -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the page fit and scale on mobile screens -->
    <meta name="description" content="A basic HTML5 page structure">
    <!-- Summary shown in search engine results -->
    <title>My First HTML5 Page</title>
    <!-- Text shown in the browser tab and bookmarks -->
</head>
<body>
    <!-- Holds everything visible on the page -->
    <h1>Hello, World!</h1>
    <!-- Main heading: the most important heading on the page -->
    <p>Welcome to my first HTML5 page.</p>
    <!-- A paragraph of text -->
</body>
</html>
