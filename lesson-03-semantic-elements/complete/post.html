<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Every HTML5 page starts with the same structure">
    <title>The HTML5 Skeleton | My Coding Blog</title>
</head>
<body>
    <header>
        <!-- Introductory content: site name, logo and navigation -->
        <h1>My Coding Blog</h1>
        <nav>
            <!-- The main navigation links, the same on every page -->
            <a href="index.html">Home</a>
            <a href="post.html">Blog</a>
        </nav>
    </header>
    <main>
        <!-- The content unique to this page; only one per page -->
        <article>
            <!-- Self-contained content that makes sense on its own -->
            <h2>The HTML5 Skeleton</h2>
            <p>Every HTML5 page starts with the same structure.</p>
            <p>Learn it once and you can read any page.</p>
        </article>
        <aside>
            <!-- Related content, separate from the main content -->
            <h3>Related Posts</h3>
            <p><a href="index.html">Why Semantic HTML Matters</a></p>
        </aside>
    </main>
    <footer>
        <!-- Closing content: copyright, contact details and links -->
        <p>&copy; 2026 My Coding Blog</p>
    </footer>
</body>
</html>
