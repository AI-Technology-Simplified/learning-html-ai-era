<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Fundamentals</title>
</head>
<body>
    <!-- The lines above are the page skeleton. We cover them in Lesson 2. -->

    <h1>Welcome</h1>
    <!-- Container element: opening tag, content (Welcome), closing tag -->
    <h2>About Us</h2>
    <!-- Also a container: it has content and a closing tag -->
    <img src="logo.png" alt="Site logo">
    <!-- Empty (void) element: no content and no closing tag -->
    <!-- Attributes: src (the image file) and alt (text describing the image) -->
    <p id="intro" class="card featured">Welcome to my site.</p>
    <!-- id is unique on the page; class can hold several names (card and featured) -->
    <p>This is <strong>important</strong> text.</p>
    <!-- Nesting: strong sits inside p, so it closes first -->

    <!-- Your turn: name each part of the link below. Lines like this one are comments: notes the browser ignores. Lesson 2 covers them. -->
    <a href="https://html.spec.whatwg.org">HTML Standard</a>
    <!-- Element name: a (a container element) -->
    <!-- Opening tag: <a href="https://html.spec.whatwg.org"> -->
    <!-- Attribute: href. Value: https://html.spec.whatwg.org -->
    <!-- Content: HTML Standard. Closing tag: </a> -->
</body>
</html>
